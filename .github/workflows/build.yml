# Release builds after changes land on master (or on demand), kept as
# downloadable artifacts on the workflow run:
# - native: client (with the embedded single-player server) and the standalone
#   server, for Windows, macOS and Linux
# - web: the browser client (no server code)
name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --package client --package server
      - uses: actions/upload-artifact@v4
        with:
          name: hall-of-worlds-${{ runner.os }}
          path: |
            target/release/hall-of-worlds
            target/release/hall-of-worlds.exe
            target/release/hall-of-worlds-server
            target/release/hall-of-worlds-server.exe
          if-no-files-found: error

  web:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.1
      - run: trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: hall-of-worlds-web
          path: dist
          if-no-files-found: error
