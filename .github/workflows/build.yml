# Release builds on demand only (Actions tab > Build > Run workflow), kept as
# downloadable artifacts on the workflow run:
# - native: client (with the embedded single-player server), the standalone
#   server and the game assets (`cargo xtask package`), for Windows, macOS and
#   Linux
# - web: the browser client (no server code)
name: Build

# Not run on every merge for now: it was too much CI work per change.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package
      - uses: actions/upload-artifact@v7
        with:
          name: hall-of-worlds-${{ runner.os }}
          path: target/package
          if-no-files-found: error

  web:
    name: Build (web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Trunk's release binary (its action still runs on Node 20). Keep the
      # version the same as Dockerfile's and docker.yml's.
      - name: Install Trunk
        env:
          TRUNK_VERSION: v0.22.1
        run: |
          file=trunk-x86_64-unknown-linux-gnu.tar.gz
          url=https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$file
          curl -fsSL -o "$file" "$url"
          echo "$(curl -fsSL "$url.sha256")  $file" | sha256sum -c -
          sudo tar -xzf "$file" -C /usr/local/bin trunk
          rm "$file"
      - run: trunk build --release --cargo-profile web
      - run: cargo xtask compress-web dist
      - uses: actions/upload-artifact@v7
        with:
          name: hall-of-worlds-web
          path: dist
          if-no-files-found: error
