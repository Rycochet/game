# Nightly builds: once a day (and when run by hand), if anything has merged
# since the last one, saves downloadable builds of what the Docker image
# `:latest` was built from:
# - the web client and the standalone Linux server, copied out of that image
#   (no second build of the slow web client)
# - native packages (`cargo xtask package`: client, server and assets) for
#   Windows, macOS and Linux, built from the same commit as the image
# The web client also gets deltas (`cargo xtask web-deltas`) from the last
# `PAST_NIGHTLIES` nightlies' wasm, read back out of their images exactly as
# they were served, so a browser that played on a nightly server in the past
# week downloads only what changed.
# Then the image gets the tags `:nightly` and `:nightly-<date>`: the image
# `:latest` was built from with one small layer of those deltas added (or the
# same image, if there were none). The tags move only after every build has
# worked, so a failed night is tried again the next night. `:latest` itself
# gets no deltas: it changes too often for them to help.
name: Nightly

on:
  schedule:
    # 04:00 UTC every day.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if :nightly is already the latest image
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Registry image names must be lowercase.
  IMAGE: ghcr.io/rycochet/hall-of-worlds
  # How many earlier nightlies' builds the web client gets deltas from: a week.
  PAST_NIGHTLIES: 7

jobs:
  image:
    name: Image and web client
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      date: ${{ steps.check.outputs.date }}
      deltas: ${{ steps.deltas.outputs.made }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Docker workflow labels each image with the commit it was built
      # from. No :nightly yet (the first run) counts as a different commit.
      - id: check
        name: Compare :latest with :nightly
        run: |
          docker pull --quiet "$IMAGE:latest"
          latest=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:latest")
          nightly=""
          if docker pull --quiet "$IMAGE:nightly"; then
            nightly=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:nightly")
          fi
          echo ":latest is $latest, :nightly is ${nightly:-missing}"
          if [ -z "$latest" ]; then
            echo "::error:::latest has no revision label"
            exit 1
          fi
          if [ "$latest" = "$nightly" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Nothing new since the last nightly build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$latest" >> "$GITHUB_OUTPUT"
          echo "short=${latest::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # From the commit's own tag, which can't move to a newer merge midway.
      - name: Copy the web client and server out of the image
        if: steps.check.outputs.build == 'true'
        run: |
          image="$IMAGE:sha-${{ steps.check.outputs.short }}"
          docker pull --quiet "$image"
          docker create --name nightly "$image"
          mkdir -p out/server
          docker cp nightly:/srv/web out/web
          docker cp nightly:/usr/local/bin/hall-of-worlds-server out/server/
          docker rm nightly
      # The earlier nightlies' wasm, newest first. Their dated tags (one per
      # night that built) never move, so each is the build browsers were sent.
      # skopeo comes with GitHub's Ubuntu runners.
      - name: Copy the earlier nightlies' wasm out of their images
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p old
          tags=$(skopeo list-tags "docker://$IMAGE" | jq -r '.Tags[]')
          { grep -E '^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$' <<< "$tags" || true; } \
            | sort -r \
            | head -n "$PAST_NIGHTLIES" > old/tags
          echo "Earlier nightlies: $(paste -sd ' ' old/tags)"
          while read -r tag; do
            docker pull --quiet "$IMAGE:$tag"
            docker create --name old "$IMAGE:$tag"
            docker cp old:/srv/web "old/$tag"
            docker rm old
            docker image rm "$IMAGE:$tag"
            find "old/$tag" -maxdepth 1 -name '*_bg.wasm' -exec mv {} "old/$tag.wasm" \;
            rm -rf "old/$tag"
          done < old/tags
      - if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.check.outputs.sha }}
          path: source
      - if: steps.check.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      # A build the same as tonight's is skipped. zstd at level 19, about a
      # minute each.
      - id: deltas
        name: Make deltas from them
        if: steps.check.outputs.build == 'true'
        run: |
          shopt -s nullglob
          old=("$PWD"/old/*.wasm)
          if [ ${#old[@]} -gt 0 ]; then
            (cd source && cargo xtask web-deltas "$GITHUB_WORKSPACE/out/web" "${old[@]}")
          fi
          if compgen -G "out/web/deltas/*.dcz" > /dev/null; then
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deltas (no earlier nightlies yet)."
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deltas.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-deltas
          path: out/web/deltas
          retention-days: 1
          if-no-files-found: error
      - if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hall-of-worlds-web-${{ steps.check.outputs.date }}-${{ steps.check.outputs.short }}
          path: out/web
          retention-days: 14
          if-no-files-found: error
      - if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hall-of-worlds-server-Linux-${{ steps.check.outputs.date }}-${{ steps.check.outputs.short }}
          path: out/server
          retention-days: 14
          if-no-files-found: error

  native:
    name: Build (${{ matrix.os }})
    needs: image
    if: needs.image.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.sha }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: hall-of-worlds-${{ runner.os }}-${{ needs.image.outputs.date }}-${{ needs.image.outputs.short }}
          path: target/package
          retention-days: 14
          if-no-files-found: error

  tag:
    name: Tag the image
    needs: [image, native]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The deltas as one more layer on the image :latest was built from,
      # pushed straight under the nightly tags (its labels, such as the
      # revision the check above reads, carry over from that image).
      - if: needs.image.outputs.deltas == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nightly-deltas
          path: context/deltas
      - name: Build :nightly and :nightly-<date> with the deltas
        if: needs.image.outputs.deltas == 'true'
        run: |
          cat > context/Dockerfile <<EOF
          FROM $IMAGE:sha-${{ needs.image.outputs.short }}
          COPY deltas /srv/web/deltas
          EOF
          docker buildx build --push \
            --tag "$IMAGE:nightly" \
            --tag "$IMAGE:nightly-${{ needs.image.outputs.date }}" \
            context
      # Without deltas: the image's manifest copied under the new tags, in the
      # registry.
      - name: Add :nightly and :nightly-<date>
        if: needs.image.outputs.deltas != 'true'
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:nightly" \
            --tag "$IMAGE:nightly-${{ needs.image.outputs.date }}" \
            "$IMAGE:sha-${{ needs.image.outputs.short }}"
