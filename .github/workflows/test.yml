# Cut down to a single `cargo check --release` on Linux while the repo is
# public with auto-merge: the full `cargo xtask test` on three OSes was too
# much work per PR. Run `cargo xtask test` locally before merging instead.
# Runs on pull requests that are ready for review (drafts are skipped) and on
# master after each merge (which also warms the build cache that PRs reuse).
name: Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needed by the build scripts of Bevy's audio/input/window crates.
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Rust itself comes from rust-toolchain.toml on the first cargo command.
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --release --workspace

  # Kept under its old name because it is the check required in GitHub branch
  # protection (and so what auto-merge waits for).
  all-passed:
    name: All tests passed
    # Also skipped for drafts; GitHub counts a skipped required check as
    # passing, but draft PRs can't be merged anyway.
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - if: needs.check.result != 'success'
        run: exit 1
