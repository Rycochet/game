# Runs `cargo xtask test` on pull requests that are ready for review (draft
# PRs are skipped, so iterate as a draft and mark it ready to test), and on
# master after each merge (which also warms the build cache that PRs reuse).
# In GitHub branch protection, make the "All tests passed" check required.
name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI doesn't need it, and with it the build folder filled the
  # Linux runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # Preinstalled toolchains we don't use; frees tens of GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Rust itself comes from rust-toolchain.toml on the first cargo command.
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test

  # Single check to require in branch protection, so the OS list above can
  # change without editing the protection rules.
  all-passed:
    name: All tests passed
    # Also skipped for drafts; GitHub counts a skipped required check as
    # passing, but draft PRs can't be merged anyway.
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.result != 'success'
        run: exit 1
