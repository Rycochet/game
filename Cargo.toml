# Workspace: shared game rules, the client app, and helper commands.
# See docs/context/architecture.md for what goes where.
[workspace]
members = ["crates/client", "crates/server", "crates/shared", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ryc O'Chet <rycochet@rycochet.com>"]
repository = "https://github.com/Rycochet/game"
license = "CC-BY-NC-4.0"
publish = false

# Versions are set once here; crates opt in with `name.workspace = true`.
[workspace.dependencies]
shared = { path = "crates/shared" }
server = { path = "crates/server" }
# Default features off here so the headless server can stay lean; the client
# turns them back on.
bevy = { version = "0.20", default-features = false }
fastnoise-lite = { version = "1.1", features = ["f64"] }
# Network (and in-process) messages: serde types encoded with postcard.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# The server's saved data: RON files, readable by people (Bevy already uses
# it), in the user's data folder.
ron = "0.12"
dirs = "6"
# Networking: the server's WebSockets and web client files on one port
# (axum, tower-http and tokio: MIT), and native clients' WebSockets
# (tungstenite: MIT/Apache-2.0).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tower-http = { version = "0.7", features = ["fs"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
# TLS. rustls (Apache-2.0/ISC/MIT), with ring (OSI-approved, needs no build
# tools beyond a C compiler) as its cryptography; tokio-rustls (MIT/Apache-2.0)
# for the server's connections; rcgen (MIT/Apache-2.0) makes its certificate,
# x509-parser (MIT/Apache-2.0) reads certificates, and time (MIT/Apache-2.0)
# dates them. rustls-platform-verifier (MIT/Apache-2.0) checks a server's
# certificate with the operating system's certificate authorities.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = "0.18"
time = "0.3"
rustls-platform-verifier = "0.7"
# Let's Encrypt certificates for the server: instant-acme (Apache-2.0), which
# checks Let's Encrypt's website with the operating system's authorities.
# rustls-acme was tried, but always brings in webpki-roots, whose licence isn't
# OSI-approved.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }

# Compile our own code with light optimisation so it still builds quickly...
[profile.dev]
opt-level = 1

# ...but fully optimise dependencies (Bevy etc), which only build once.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
