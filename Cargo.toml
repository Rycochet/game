# Workspace: shared game rules, the client app, and helper commands.
# See docs/context/architecture.md for what goes where.
[workspace]
members = ["crates/client", "crates/server", "crates/shared", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ryc O'Chet <rycochet@rycochet.com>"]
repository = "https://github.com/Rycochet/game"
license = "CC-BY-NC-4.0"
publish = false

# Versions are set once here; crates opt in with `name.workspace = true`.
[workspace.dependencies]
shared = { path = "crates/shared" }
server = { path = "crates/server" }
# Default features off here so the headless server can stay lean; the client
# turns them back on.
bevy = { version = "0.20", default-features = false }
fastnoise-lite = { version = "1.1", features = ["f64"] }
# Network (and in-process) messages: serde types encoded with postcard.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Compile our own code with light optimisation so it still builds quickly...
[profile.dev]
opt-level = 1

# ...but fully optimise dependencies (Bevy etc), which only build once.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
