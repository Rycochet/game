[package]
name = "game"
version = "0.1.0"
edition = "2024"
description = "Multiplayer roguelike with an infinite world"
authors = ["Ryc O'Chet <rycochet@rycochet.com>"]
repository = "https://github.com/Rycochet/game"
publish = false

[dependencies]
bevy = "0.20"

# Project helper commands, run as `cargo xtask <task>` (see .cargo/config.toml).
[workspace]
members = ["xtask"]

# Compile our own code with light optimisation so it still builds quickly...
[profile.dev]
opt-level = 1

# ...but fully optimise dependencies (Bevy etc), which only build once.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
