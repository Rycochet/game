# Hall of Worlds server, with a self-signed certificate: https://<this computer>:24691
services:
  hall-of-worlds:
    image: ghcr.io/reigningcoo/hall-of-worlds:latest
    restart: unless-stopped
    ports:
      - "24691:24691" # The game and the web client, over HTTPS.
      - "24690:24690" # Only answers health checks, and that connections must be secure.
    environment:
      # Other names or addresses this server is reached by, so the certificate
      # covers them. Change this, or remove it if you only use localhost.
      HOW_TLS_NAMES: game.example.com,192.168.0.10
      # The user and group the server runs as, and owns its saves as.
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - saves:/data # Saves and the certificate.
    # Time to save everyone before stopping.
    stop_grace_period: 30s

volumes:
  saves:
