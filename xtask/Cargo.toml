[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Brotli copies of the web build's files (`compress-web`), in pure Rust
# (BSD-3-Clause/MIT), so no brotli tool needs installing.
brotli = "8"
# The combat rules, for fight simulations (`fight`).
shared.workspace = true
# Deltas for browsers that have an older build (`web-deltas`).
web_delta.workspace = true
# Draws the game-icons.net SVGs as PNGs (`icons`), in pure Rust (Apache-2.0 OR
# MIT); without fonts or images, as the icons are plain shapes.
resvg = { version = "0.49", default-features = false }
# The title font's letter outlines, for the app icon (`app-icon`), in pure
# Rust (MIT OR Apache-2.0); already used by resvg.
ttf-parser = "0.25"
