[package]
name = "server"
description = "Hall of Worlds game server: the authoritative game simulation (native only)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# The standalone (dedicated / Docker) server. Native clients link the library
# instead, for single player.
[[bin]]
name = "hall-of-worlds-server"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
ron.workspace = true
dirs.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
rustls.workspace = true
ring.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
time.workspace = true
instant-acme.workspace = true
uuid = { workspace = true, features = ["std", "rng", "v6"] }
# Headless: no rendering, windowing, audio or input.
bevy = { workspace = true, features = ["std", "bevy_log", "multi_threaded"] }
# Only with the `debug-api` feature.
bevy_remote = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# The debug API: Bevy's remote protocol on localhost, turned on at start by
# `HOW_DEBUG_API`. Debug builds only: a release build with it refuses to
# compile. See docs/context/debug-api.md.
debug-api = ["dep:bevy_remote", "dep:serde_json"]

[dev-dependencies]
tungstenite.workspace = true
