[package]
name = "client"
description = "Hall of Worlds game client: native app and browser (WebAssembly)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hall-of-worlds"
path = "src/main.rs"

[dependencies]
shared.workspace = true
bevy = { workspace = true, features = ["default"] }

# Native clients embed the server for single player; the web client only
# ever connects to a server.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
server.workspace = true
