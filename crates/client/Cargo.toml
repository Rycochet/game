[package]
name = "client"
description = "Hall of Worlds game client: native app and browser (WebAssembly)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hall-of-worlds"
path = "src/main.rs"

[dependencies]
shared.workspace = true
bevy = { workspace = true, features = ["default"] }
# The player's locale, for how floors are numbered, on native and in browsers.
sys-locale = { version = "0.3", features = ["js"] }

# Native clients embed the server for single player (or connect to one over
# a WebSocket); the web client only ever connects to a server.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
server.workspace = true
tungstenite.workspace = true

# The browser's WebSocket, location and storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Crypto",
    "Event",
    "Location",
    "MessageEvent",
    "Storage",
    "WebSocket",
    "Window",
] }
