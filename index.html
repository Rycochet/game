<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Game</title>
        <!-- Tells Trunk to compile the Rust crate to WebAssembly and load it. -->
        <link data-trunk rel="rust" data-wasm-opt="s" />
        <link data-trunk rel="copy-dir" href="assets" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            #game {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
    </body>
</html>
