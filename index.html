<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hall of Worlds</title>
        <!-- Tells Trunk to compile the Rust crate to WebAssembly and load it. -->
        <link data-trunk rel="rust" href="crates/client/Cargo.toml" data-bin="hall-of-worlds" data-wasm-opt="s" />
        <link data-trunk rel="copy-dir" href="crates/client/assets" />
        <link rel="preload" href="assets/fonts/CinzelDecorative-Bold.ttf" as="font" type="font/ttf" crossorigin />
        <style>
            @font-face {
                font-family: "Cinzel Decorative";
                src: url("assets/fonts/CinzelDecorative-Bold.ttf");
            }
            @font-face {
                font-family: "Lexend";
                src: url("assets/fonts/Lexend-Variable.ttf");
                font-weight: 100 900;
                font-display: swap;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
                overscroll-behavior: none;
            }
            #game {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
                /* The game has its own gestures: the browser mustn't scroll or
                   zoom the page, or select or offer to save the picture. */
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }
            /* The download's loading screen, until the game has drawn its own: the
               colours and sizes are copied from crates/client/src/loading_screen. */
            #loading,
            #ended {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0a0812;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            /* After quitting, the same screen with a button in place of the bar:
               shown by crates/client/src/system_menu. */
            #ended[hidden] {
                display: none;
            }
            #loading-title {
                /* Hidden until its font has loaded, so it never shows in another. */
                visibility: hidden;
            }
            #loading-title,
            #ended-title {
                font: min(17.35vw, 20.83vh) / 1.2 "Cinzel Decorative", serif;
                text-align: center;
                color: #edbf61;
                text-shadow: 3px 3px #591f0d;
            }
            #loading-bar,
            #reload {
                position: absolute;
                left: 32px;
                right: 32px;
                bottom: 32px;
                height: 32px;
                text-align: center;
                font: 18px/32px "Lexend", sans-serif;
                color: #f2ebd9;
                background: #211c29;
            }
            #reload {
                padding: 0;
                border: 1px solid #edbf61;
                cursor: pointer;
            }
            #loading-bar span {
                animation: 2s step-end infinite;
            }
            @keyframes dot1 {
                from { opacity: 0; }
                25%, to { opacity: 1; }
            }
            @keyframes dot2 {
                from { opacity: 0; }
                50%, to { opacity: 1; }
            }
            @keyframes dot3 {
                from { opacity: 0; }
                75%, to { opacity: 1; }
            }
        </style>
        <script>
            // Safari's own pinch zoom, which it may start despite touch-action.
            document.addEventListener("gesturestart", (event) => event.preventDefault());
        </script>
    </head>
    <body>
        <canvas id="game"></canvas>
        <div id="loading">
            <div id="loading-title">Hall of<br />Worlds</div>
            <div id="loading-bar">Downloading<span style="animation-name: dot1">.</span><span style="animation-name: dot2">.</span><span style="animation-name: dot3">.</span></div>
        </div>
        <div id="ended" hidden>
            <div id="ended-title">Hall of<br />Worlds</div>
            <button id="reload" type="button" onclick="location.reload()">Click to reload</button>
        </div>
        <script>
            // If the font can't load, the title still shows, in the fallback.
            document.fonts.load('1em "Cinzel Decorative"').finally(() => {
                document.getElementById("loading-title").style.visibility = "visible";
            });
        </script>
    </body>
</html>
